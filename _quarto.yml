project:
  type: website
  output-dir: _site
  render:
    - index.md
    - musica/*.md
    - musica/obras/*.md
    - literatura/*.md
    - literatura/narrativa/*.md
    - talleres/*.md
    - investigacion/*.md
    - aplicaciones/index.md
    - aplicaciones/fichas/*.md
  resources:
    - "aplicaciones/**"
    - "audio/**"
    - "cuentos/**"
    - "partituras/**"
    - "programas/**"

website:
  title: "Alevi Peña"
  description: "Archivo autoral de música, literatura, investigación y herramientas digitales."
  navbar:
    background: "#0b0f14"
    foreground: "#f2f5f7"
    pinned: true
    collapse-below: lg
    search: true
    left:
      - href: index.md
        text: Inicio
      - href: musica/index.md
        text: Música
      - href: literatura/index.md
        text: Literatura
      - href: investigacion/index.md
        text: Investigación
      - href: talleres/index.md
        text: Talleres
      - href: aplicaciones/index.md
        text: Aplicaciones
  back-to-top-navigation: true
  page-footer:
    background: "#0b0f14"
    foreground: "#aeb8c2"
    border: true
    left: "© Alevi Peña"
    right: "Licencias indicadas en cada obra o recurso."

lang: es

format:
  html:
    theme: darkly
    css: styles.css
    toc: false
