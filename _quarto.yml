project:
  type: website
  output-dir: _site
  render:
    - index.md
    - musica/*.md
    - musica/obras/*.md
  resources:
    - "aplicaciones/**"
    - "audio/**"
    - "cuentos/**"
    - "partituras/**"
    - "programas/**"

website:
