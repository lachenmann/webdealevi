name: Esferas Microtonal — prototipo original TTF
on:
  push:
    branches:
      - feature/monocordio-fuente-microtonal-original
    paths:
      - "aplicaciones/monocordio/fuente-propia/**"
      - ".github/workflows/esferas-font-prototype.yml"
  pull_request:
    paths:
      - "aplicaciones/monocordio/fuente-propia/**"
      - ".github/workflows/esferas-font-prototype.yml"
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar biblioteca tipográfica
        run: python3 -m pip install --quiet fonttools pillow
      - name: Generar TTF original de forma transitoria
        working-directory: aplicaciones/monocordio/fuente-propia
        run: |
          python3 build_font.py --out /tmp/EsferasMicrotonal-Prototype.ttf
          file /tmp/EsferasMicrotonal-Prototype.ttf
      - name: Probar estructura, glifos, fracciones y tablas
        working-directory: aplicaciones/monocordio/fuente-propia
        run: python3 -m unittest -v test_font.py
      - name: Validar documentación morfológica v0.2
        working-directory: aplicaciones/monocordio/fuente-propia
        run: python3 -m unittest -v test_design_v02.py
      - name: Renderizar lámina sin distribuir archivo de fuente
        working-directory: aplicaciones/monocordio/fuente-propia
        run: |
          python3 preview_font.py --font /tmp/EsferasMicrotonal-Prototype.ttf \
            --out /tmp/esferas-microtonal-vista.png
          file /tmp/esferas-microtonal-vista.png
          test -s /tmp/esferas-microtonal-vista.png
      - name: Compilar por separado las tres matrices v0.2
        working-directory: aplicaciones/monocordio/fuente-propia/v02
        run: |
          python3 build_mothers.py --out /tmp/EsferasMicrotonal-Mothers-v02.ttf
          file /tmp/EsferasMicrotonal-Mothers-v02.ttf
      - name: Validar becuadro, contornos, métricas y UPM de las matrices v0.2
        working-directory: aplicaciones/monocordio/fuente-propia/v02
        run: python3 -m unittest -v test_mothers.py
      - name: Renderizar v0.2 a escala de pentagrama (NO distribuir TTF)
        working-directory: aplicaciones/monocordio/fuente-propia/v02
        run: |
          python3 preview_mothers.py --font /tmp/EsferasMicrotonal-Mothers-v02.ttf \
            --out /tmp/esferas-matrices-v02.png
          file /tmp/esferas-matrices-v02.png
          test -s /tmp/esferas-matrices-v02.png
      - name: Conservar únicamente vista y manifiesto (NO TTF)
        uses: actions/upload-artifact@v4
        with:
          name: esferas-microtonal-prototipo-qa
          path: |
            /tmp/esferas-microtonal-vista.png
            /tmp/EsferasMicrotonal-Prototype.json
            /tmp/esferas-matrices-v02.png
            /tmp/EsferasMicrotonal-Mothers-v02.json
          retention-days: 14
