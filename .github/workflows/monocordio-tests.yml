name: Monocordio — verificaciones
on:
  push:
    branches:
      - feature/monocordio-pitagorico-mvp
      - feature/monocordio-escala-microtonal
      - feature/monocordio-v1.2-notacion-avanzada
      - feature/monocordio-v1.3-tetraktys-medias
    paths:
      - "aplicaciones/monocordio/**"
      - ".github/workflows/monocordio-tests.yml"
  pull_request:
    paths:
      - "aplicaciones/monocordio/**"
      - ".github/workflows/monocordio-tests.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis del código
        run: |
          node --check aplicaciones/monocordio/core.mjs
          node --check aplicaciones/monocordio/monocordio.mjs
          node --check aplicaciones/monocordio/escala-core.mjs
          node --check aplicaciones/monocordio/escala.mjs
          node --check aplicaciones/monocordio/notacion-core.mjs
          node --check aplicaciones/monocordio/notacion-ui.mjs
          node --check aplicaciones/monocordio/notacion-glyphs.mjs
          node --check aplicaciones/monocordio/armonia-core.mjs
          node --check aplicaciones/monocordio/armonia.mjs
      - name: Verificar el modelo acústico
        run: node --test aplicaciones/monocordio/tests/*.test.mjs
      - name: Prueba real de notación SVG en Chrome
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/monocordio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8765/aplicaciones/monocordio/ > /dev/null; then break; fi
            sleep 0.25
          done
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --virtual-time-budget=4500 --dump-dom \
            "http://127.0.0.1:8765/aplicaciones/monocordio/?build=VEC-20261010-01" \
            > /tmp/monocordio-render.html 2>/tmp/monocordio-chrome.log
          grep -q 'data-ready="true"' /tmp/monocordio-render.html
          grep -q 'data-active-build="VEC-20261010-01"' /tmp/monocordio-render.html
          grep -q 'data-notation-glyph="quarter-sharp"' /tmp/monocordio-render.html
          # El medio sostenido debe estar en el pentagrama del EJEMPLO,
          # no solamente en el muestrario estático de signos.
          grep -q 'data-rendered-glyphs="quarter-sharp"' /tmp/monocordio-render.html
          grep -q 'data-notation-glyph="reverse-flat-outline"' /tmp/monocordio-render.html
          if grep -q 'Stein–Zimmermann' /tmp/monocordio-render.html; then
            echo "ERROR: se detectó contenido de notación obsoleto." >&2
            exit 1
          fi
          echo "PASS: motor SVG cargado, notas y alteraciones dibujadas en Chrome."
